name: Build and test LoggX Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux multimedia dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev ffmpeg
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"
      - name: Native UI smoke test
        if: runner.os == 'Linux'
        run: build/LoggXStudio --smoke-test native-ui.png examples/First-Beat.loggx
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upload native UI capture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LoggX-native-ui
          path: native-ui.png
          if-no-files-found: error
      - name: Include documentation
        shell: bash
        run: cp README.md dist/ && cp -R docs dist/docs && cp -R examples dist/examples
      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: LoggX-Studio-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
